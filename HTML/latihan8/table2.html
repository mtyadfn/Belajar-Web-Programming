<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Table2</title>
</head>
<body>

	<!-- Table Merging -->
	<table border="1" cellspacing="0" cellpadding="5">
		<tr>
			<td>1,1</td>
			<td>1,2</td>
			<td>1,3</td>
		</tr>

		<tr>
			<td>2,1</td>
			<td>2,2</td>
			<td>2,3</td>
		</tr>

		<tr>
			<td>3,1</td>
			<td>3,2</td>
			<td>3,3</td>
		</tr>
	</table>

	<br><hr><br>

	<!-- Colspan = menggabungkan kolom -->

	<table border="1" cellspacing="0" cellpadding="5">
		<tr>
			<td>1,1</td>
			<td colspan="2">Colspan 2</td>
		</tr>

		<tr>
			<td>2,1</td>
			<td>2,2</td>
			<td>2,3</td>
		</tr>

		<tr>
			<td>3,1</td>
			<td>3,2</td>
			<td>3,3</td>
		</tr>
	</table>

	<br><hr><br>

	<!-- Rowspan = menggabungkan baris -->
	<table border="1" cellspacing="0" cellpadding="5">
		<tr>
			<td rowspan="3">Rowspan 3</td>
			<td colspan="2">Colspan 2</td>
		</tr>

		<tr>
			<td>2,2</td>
			<td>2,3</td>
		</tr>

		<tr>
			<td>3,2</td>
			<td>3,3</td>
		</tr>
	</table>

	<br><hr><br>

	<!-- Latihan -->
	<table border="1" cellspacing="0" cellpadding="5">
		<tr>
			<td>1,1</td>
			<td>1,2</td>
			<td>1,3</td>
			<td>1,4</td>
		</tr>

		<tr>
			<td>2,1</td>
			<td colspan="2" rowspan="2"></td>
			<td>2,4</td>
		</tr>

		<tr>
			<td>3,1</td>
			<td>3,4</td>
		</tr>

		<tr>
			<td>4,1</td>
			<td>4,2</td>
			<td>4,3</td>
			<td>4,4</td>
		</tr>
	</table>

</body>
</html>
