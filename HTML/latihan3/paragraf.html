<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>HTML Paragraf</title>
</head>
<body>

<!-- Contoh tag p, br, dan hr -->
<p>ini adalah paragraf 1</p>
<br>
<p>ini adalah <br> paragraf 2</p>
<hr>

<!-- Contoh tag b, i dan u -->
<p><b>Selamat datang</b> di kuliah <i>Pemrograman web</i></p>
<p>Nama saya <u>Mutiya Adifa</u></p>
<hr>

<!-- Contoh tag strong dan em. strong sama kaya b (bold) dan em sama kaya i (italic) -->
<p><strong>Pengumuman</strong>. Kuliah Pemrograman Web <em>ditiadakan</em></p>

</body>
</html>
