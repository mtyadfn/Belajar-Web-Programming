<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Form - Table</title>
</head>
<body>

	<form>
		<table border="0" cellpadding="5" cellspacing="0">
			<!-- Text -->
			<tr>
				<td align="right"><label for="text">Text :</label></td>
				<td><input type="text" id="text"></td>
			</tr>

			<!-- Password -->
			<tr>
				<td align="right"><label for="password">Password :</label></td>
				<td><input type="password" id="password"></td>
			</tr>

			<!-- Radio -->
			<tr>
				<td colspan="2" align="center">
					<label for="radio1">Radio 1</label><input type="radio" id="radio1" name="radio12">
					<label for="radio2">Radio 2</label><input type="radio" id="radio2" name="radio12">
				</td>
			</tr>

			<!-- Checkbox -->
			<tr>
				<td colspan="2" align="center">
					<label for="cb1">Checkbox 1</label><input type="checkbox" id="cb1">
					<label for="cb2">Checkbox 2</label><input type="checkbox" id="cd2">
				</td>
			</tr>

			<!-- Combo Box -->
			<tr>
				<td align="right"><label>Combo Box :</label></td>
				<td>
					<select>
						<option>Option 1</option>
						<option>Option 2</option>
						<option>Option 3</option>
					</select>
				</td>
			</tr>

			<!-- Textarea -->
			<tr>
				<td align="right">Textarea :</td>
				<td><textarea></textarea></td>
			</tr>

			<!-- tombol submit -->
			<tr>
				<td colspan="2" align="center"><button type="submit">Button</button></td>
			</tr>
		</table>
	</form>

</body>
</html>
