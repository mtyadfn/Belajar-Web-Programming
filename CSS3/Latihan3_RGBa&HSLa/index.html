<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGBa dann HSLa</title>

    <style>
        body {
            background-image: url(bc.png);        }

        .satu {
            height: 300px;
            width: 300px;
            background-color: rgba(0, 139, 139, 0.5);
            position: relative;
        }

        .dua {
            height: 100px;
            width: 100px;
            background-color: rgb(255, 255, 0);
            position: absolute;
            right: -50px;
            bottom: -50px;
        }
    </style>

</head>
<body>

    <div class="satu">
        <div class="dua"></div>
    </div>
    
</body>
</html>
