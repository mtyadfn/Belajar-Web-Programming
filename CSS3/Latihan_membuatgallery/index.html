<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>My Illustrations</h1>

    <div class="container">

        <ul class="gallery">

            <!-- Gambar 1 -->
            <li>
                <a href="#gambar-1">
                    <img src="img/thumbs/boy_illustration_thumbs.png" alt="Boy">
                    <span>Boy</span>
                </a>

                <div class="overlay" id="gambar-1">
                    <a href="#" class="close">X Close</a>
                    <a href="#gambar-4" class="prev">prev</a>
                    <img src="img/full/boy_illustration_full.png" alt="Boy">
                    <a href="#gambar-2" class="next">next</a>
                </div>
            </li>

            <!-- Gambar 2 -->
            <li>
                <a href="#gambar-2">
                    <img src="img/thumbs/girl_illustration_thumbs.png" alt="Girl">
                    <span>Girl</span>
                </a>

                <div class="overlay" id="gambar-2">
                    <a href="#" class="close">X Close</a>
                    <a href="#gambar-1" class="prev">prev</a>
                    <img src="img/full/girl_illustration_full.png" alt="Girl">
                    <a href="#gambar-3" class="next">next</a>
                </div>
            </li>

            <!-- Gambar 3 -->
            <li>
                <a href="#gambar-3">
                    <img src="img/thumbs/woman_illustration_thumbs.png" alt="Woman">
                    <span>Woman</span>
                </a>

                <div class="overlay" id="gambar-3">
                    <a href="#" class="close">X Close</a>
                    <a href="#gambar-2" class="prev">prev</a>
                    <img src="img/full/woman_illustration_full.png" alt="Woman">
                    <a href="#gambar-4" class="next">next</a>
                </div>
            </li>

            <!-- Gambar 4 -->
            <li>
                <a href="#gambar-4">
                    <img src="img/thumbs/man_illustration_thumbs.png" alt="Man">
                    <span>Man</span>
                </a>

                <div class="overlay" id="gambar-4">
                    <a href="#" class="close">X Close</a>
                    <a href="#gambar-3" class="prev">prev</a>
                    <img src="img/full/man_illustration_full.png" alt="Man">
                    <a href="#gambar-1" class="next">next</a>
                </div>
            </li>

            <div class="clear"></div>
        </ul>

    </div>
    
</body>
</html>
