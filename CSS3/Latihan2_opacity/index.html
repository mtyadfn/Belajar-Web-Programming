<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opacity</title>

    <style>
        body {
            background-image: url(bc.png);
            background-color: #ffb2acff;
        }

        .satu {
            height: 300px;
            width: 300px;
            background-color: darkcyan;
            opacity: .5;
            position: relative;
        }

        .dua {
            height: 100px;
            width: 100px;
            background-color: yellow;
            position: absolute;
            right: -50px;
            bottom: -50px;
            opacity: 1;
        }
    </style>

</head>
<body>

    <div class="satu">
        <div class="dua"></div>
    </div>
    
</body>
</html>
