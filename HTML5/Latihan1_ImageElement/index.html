<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Elements</title>

    <style>
        body {
            font-family: sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.125em;
            line-height: 1.6;
            color: #333;
            padding: 2em;
        }
        .hero {
            display: grid;
            grid-gap: 2em;
            align-items: center;
        }
        img {
            max-width: 100%;
            height: auto;
        }

        @media (min-widht: 960px){
            .hero {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>

</head>


<body>

    <div class="hero">
        <div class="hero-text">
            <h1>Heloo abuu</h1>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Explicabo, suscipit sed reiciendis rerum, maxime eveniet numquam dolores harum, vero cupiditate quia laborum eligendi optio. Quam veritatis in aspernatur natus id.</p>
        </div>
        <picture>
            <source media="(min-width: 960: px)" srcset="img2/cat-large.jpg" sizes="50vw">
            <source media="(min-width: 600: px)" srcset="img2/cat-medium.jpg">
            <img src="img2/cat-small.jpg" alt="kucing abu">
        </picture>
    </div>

</body>
</html>
