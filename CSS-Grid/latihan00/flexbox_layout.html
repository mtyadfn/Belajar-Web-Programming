<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-size: 20px;
            font-family: 'Courier New', Courier, monospace;
            color: white;
            text-align: center;
            text-transform: uppercase;
        }
        .container {
            width: 600px;
            border: 5px solid black;
            box-sizing: border-box;
            margin: 50px auto;
            padding: 5px;
        }

        header {
            background-color: purple;
            padding: 40px 0;
        }
        .sidebar aside {
            background-color: blue;
            padding: 60px 0;
        }
        .sidebar nav {
            background-color: red;
            padding: 100px 0;
        }
        main {
            background-color: brown;
            padding: 171.5px;
            box-sizing: border-box;
            flex: 1.5;
        }
        footer {
            background-color: gray;
            padding: 20px 0;
        }
        .sidebar {
            flex: 1;
        }
        .content {
            display: flex;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>Header</header>
        <div class="content">
            <div class="sidebar">
                <aside>Aside</aside>
                <nav>Nav</nav>
            </div>
            <main>Main</main>
        </div>
        <footer>Footer</footer>
    </div>
</body>
</html>
