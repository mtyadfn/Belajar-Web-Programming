<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bermain Warna</title>

    <style>
        html, body {
            height: 100%;
        }

        body {
            text-align: center;
        }

        .wrn-palevioletred {
            background-color: palevioletred;
        }

        .kotak {
            width: 35px;
            height: 35px;
            margin: 10px auto;
        }

        .merah {
            background-color: red;
        }

        .hijau {
            background-color: green;
        }

        .biru {
            background-color: blue;
        }

    </style>
</head>
<body>

    <h1>BERMAIN DENGAN WARNA</h1>

    <button type="button" id="btnWarna">Push</button>

    <br><br>

    <!-- Membuat slider -->
    <div class="kotak merah"></div>
    <input type="range" name="sMerah" min="0" max="255">

    <div class="kotak hijau"></div>
    <input type="range" name="sHijau" min="0" max="255">

    <div class="kotak biru"></div>
    <input type="range" name="sBiru" min="0" max="255">



    <script src="script.js"></script>
</body>
</html>
